<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patrick's Mindgarden — Print</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..700,0..100;1,9..144,300..700,0..100&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #fff;
    overflow: visible;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Stop the polaroid float animation in print */
  .polaroid.motion-on { animation: none !important; }
  .polaroid { transition: none !important; }

  /* Hide the download flyout — it's a post-load animated overlay */
  .download-flyout { display: none !important; }

  /* Disable tweaks panel entirely */
  .twk-panel, .tweaks-launcher { display: none !important; }

  /* Page layout */
  .page {
    display: flex;
    align-items: center;
    justify-content: center;
    break-inside: avoid;
    page-break-inside: avoid;
    background: #fff;
  }
  .page + .page { break-before: page; page-break-before: always; }

  /* Desktop page — landscape 1440×900 */
  .page-desktop {
    width: 1440px;
    height: 900px;
    margin: 0 auto;
  }
  .page-desktop .frame {
    width: 1440px;
    height: 900px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(20,24,20,0.06);
  }

  /* Mobile page — portrait 375×812 */
  .page-mobile {
    width: 100%;
    min-height: 1000px;
    margin: 0 auto;
    padding: 60px 0;
    flex-direction: column;
    gap: 20px;
  }
  .page-mobile .frame {
    width: 375px;
    height: 812px;
    position: relative;
    overflow: hidden;
    border-radius: 32px;
    box-shadow: 0 4px 20px rgba(20,24,20,0.14);
  }
  .page-mobile .caption {
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    color: rgba(20,24,20,0.55);
    letter-spacing: 0.04em;
  }

  @media screen {
    body { padding: 40px; background: #EDE8D8; }
    .page { margin-bottom: 40px; box-shadow: 0 20px 60px -20px rgba(0,0,0,0.25); }
  }

  @page :first {
    size: 1440px 900px;
    margin: 0;
  }
  @page {
    size: 375px 1000px;
    margin: 0;
  }

  @media print {
    body { padding: 0; background: #fff; }
    .page { margin: 0; box-shadow: none; }
    .page-desktop, .page-mobile { padding: 0; }
  }
</style>
</head>
<body>
  <div id="desktop-root" class="page page-desktop"><div class="frame" id="desktop-frame"></div></div>
  <div id="mobile-root"  class="page page-mobile"><div class="frame" id="mobile-frame"></div><div class="caption">Patrick's Mindgarden · Mobile 375×812</div></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="thumbnails.jsx"></script>
  <script type="text/babel" src="polaroid.jsx"></script>
  <script type="text/babel" src="scene.jsx"></script>

  <script type="text/babel" data-presets="react">
    // Freeze bg warmth for print
    document.documentElement.style.setProperty('--bg-warmth', '0.2');

    // Render both scenes directly — no DesignCanvas wrapper, no Tweaks.
    // motionOn=false to avoid animations; showAnnotations=false for clean output.
    ReactDOM.createRoot(document.getElementById('desktop-frame')).render(
      <DesktopScene motionOn={false} rotationRange={13} spreadAmount={1.15} showAnnotations={false} />
    );
    ReactDOM.createRoot(document.getElementById('mobile-frame')).render(
      <MobileScene motionOn={false} rotationRange={13} spreadAmount={1.15} />
    );

    // Auto-print once fonts + JSX are ready
    (async () => {
      try { if (document.fonts && document.fonts.ready) { await document.fonts.ready; } } catch (e) {}
      await new Promise((r) => setTimeout(r, 700));
      window.print();
    })();
  </script>
</body>
</html>
